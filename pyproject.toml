[project]
name = "auto-apply"
version = "0.1.0"
description = "Durable job-application automation: Temporal orchestration + AI resume + recipe-driven browser execution"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "temporalio>=1.8",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "anthropic>=0.40",
    "python-telegram-bot>=21.7",
    "playwright>=1.49",
    "boto3>=1.35",
    "httpx>=0.27",
    "structlog>=24.4",
    "pyyaml>=6.0",
    "selectolax>=0.3.21",
    "weasyprint>=69.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
    "boto3-stubs[s3]>=1.35",
    "pytest-timeout>=2.4.0",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auto_apply"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle / pyflakes
    "I",                # isort
    "UP",               # pyupgrade
    "B",                # bugbear
    "SIM",              # simplify
    "ASYNC",            # async pitfalls
    "RUF",
    "TID252",           # relative import 규칙
    "ANN",              # 타입 애노테이션 강제
]
ignore = ["ANN401"]     # **kwargs: Any 허용

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "B"]
# 전각 괄호·구두점(【】〔〕（）［］ 등)을 정규식으로 직접 매치한다 — 채용공고 제목의
# 실제 표기다. ASCII로 "고쳐주는" 제안은 오탐 매칭을 없애는 게 아니라 만든다.
"src/auto_apply/domain/job_identity.py" = ["RUF001"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src"
packages = ["auto_apply"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# py.typed 없는 벤더 패키지 — HTML→PDF 렌더링만 하고 타입 시그니처는 안 쓴다.
module = ["weasyprint.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# 워크플로우 테스트가 멈추면 CI 를 붙잡지 않고 실패하게 한다
addopts = "-q --strict-markers --timeout=120"
# 마커는 "무엇이 있어야 도는가"로만 가른다. 예전엔 integration 하나가 Docker 필요와
# "Temporal 테스트 서버 바이너리만 필요"를 뭉쳐서, 아무 인프라 없이도 도는 워크플로우 테스트
# 66개가 커밋 전 게이트(make check)에서 통째로 빠져 있었다 — 정작 CLAUDE.md 는 워크플로우를
# 만들면 WorkflowEnvironment 테스트를 쓰라고 요구한다. 마커가 없는 테스트는 전부 기본 실행이다
# (temporalio 가 테스트 서버 바이너리를 캐시에 자동으로 받아둔다).
markers = [
    "docker: `make up` 인프라(postgres/minio)가 있어야 도는 테스트",
    "native: 이 머신에 설치된 외부 바이너리·시스템 라이브러리가 있어야 도는 테스트 (playwright 브라우저, agent-browser CLI, weasyprint 의 cairo/pango)",
    "temporal: Temporal 테스트 서버를 띄우는 테스트 — Docker 는 불필요하므로 make check 에 포함된다. 테스트당 서버를 새로 띄워 느리니 빠른 반복은 make test-fast 로 뺀다",
]

# ---------------------------------------------------------------- import-linter
# ARCHITECTURE.md §11 의 계층 규칙을 CI에서 강제한다.
[tool.importlinter]
root_package = "auto_apply"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "domain 은 순수하다 (프레임워크/어댑터 무의존)"
type = "forbidden"
source_modules = ["auto_apply.domain"]
forbidden_modules = [
    "auto_apply.adapters", "auto_apply.ports", "auto_apply.api",
    "auto_apply.workflows", "auto_apply.activities", "auto_apply.bootstrap",
    "sqlalchemy", "temporalio", "fastapi", "anthropic", "playwright", "boto3",
]

[[tool.importlinter.contracts]]
name = "ports 는 구현을 모른다"
type = "forbidden"
source_modules = ["auto_apply.ports"]
forbidden_modules = [
    "auto_apply.adapters", "auto_apply.activities", "auto_apply.workflows",
    "auto_apply.api", "auto_apply.bootstrap",
    "sqlalchemy", "anthropic", "playwright", "boto3", "telegram",
]

[[tool.importlinter.contracts]]
name = "contracts 는 workflow-safe (벤더 의존 없음)"
type = "forbidden"
source_modules = ["auto_apply.contracts"]
forbidden_modules = [
    "auto_apply.adapters", "auto_apply.ports", "auto_apply.activities",
    "auto_apply.api", "auto_apply.bootstrap",
    "sqlalchemy", "anthropic", "playwright", "boto3", "telegram", "fastapi",
]

[[tool.importlinter.contracts]]
name = "ai 는 벤더 SDK 를 모른다 (프롬프트/스키마만, 오케스트레이션 프레임워크에 안 묶인다)"
type = "forbidden"
source_modules = ["auto_apply.ai"]
forbidden_modules = [
    "auto_apply.adapters", "auto_apply.ports", "auto_apply.activities",
    "auto_apply.workflows", "auto_apply.api", "auto_apply.bootstrap",
    "sqlalchemy", "anthropic", "playwright", "boto3", "telegram", "fastapi",
]

[[tool.importlinter.contracts]]
name = "workflow 는 contracts/domain 만 본다"
type = "forbidden"
source_modules = ["auto_apply.workflows"]
forbidden_modules = [
    "auto_apply.adapters", "auto_apply.ports", "auto_apply.activities",
    "auto_apply.api", "auto_apply.bootstrap",
    "sqlalchemy", "anthropic", "playwright", "boto3", "telegram", "fastapi",
]

[[tool.importlinter.contracts]]
name = "adapters 는 상위 계층을 모른다"
type = "forbidden"
source_modules = ["auto_apply.adapters"]
forbidden_modules = [
    "auto_apply.workflows", "auto_apply.activities",
    "auto_apply.api", "auto_apply.bootstrap",
]

[[tool.importlinter.contracts]]
# 운영 진입점 계층(telegram/·cli·watchdog·worker·schedule*·apply_intake·pending_decisions·
# process_alerts·resume_cleanup)은 원래 어떤 계약에도 안 걸려 있었다. 계층 규칙이 강한 곳(domain/ports/
# workflows)을 피해 새 기능이 전부 이 무규칙 지대로 흘러드는 압력이 있어서(채팅 도구·스케줄·
# 자동 지원이 실제로 그렇게 자랐다), 규칙을 새로 만들지 않고 **이미 있는 계약 하나**를 이
# 층까지 넓히는 쪽을 택했다 — "어댑터를 만드는 곳은 bootstrap 하나"(CLAUDE.md 절대규칙급)는
# 이 층에도 그대로 성립해야 하는 불변식이다. 그 외에는 자유롭게 둔다(이 층은 Temporal Client
# SDK 를 직접 쓰는 게 정상이고, workflows/activities 를 import 하는 것도 정상이다).
name = "어댑터 생성은 bootstrap 에서만"
type = "forbidden"
# bootstrap 을 '거쳐서' 닿는 것은 정상이다. 직접 import 만 금지한다.
allow_indirect_imports = true
source_modules = [
    "auto_apply.api",
    "auto_apply.activities",
    "auto_apply.telegram",
    "auto_apply.cli",
    "auto_apply.watchdog",
    "auto_apply.worker",
    "auto_apply.schedule",
    "auto_apply.schedule_config",
    "auto_apply.apply_intake",
    "auto_apply.pending_decisions",
    "auto_apply.process_alerts",
    "auto_apply.resume_cleanup",
]
forbidden_modules = ["auto_apply.adapters"]
