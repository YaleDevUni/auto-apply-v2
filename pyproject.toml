[project]
name = "auto-apply"
version = "0.1.0"
description = "Local job-application assistant: Claude drives the browser, a harness blocks final submit until a human approves"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "aiosqlite>=0.22.1",
    "anthropic>=0.40",
    "playwright>=1.49",
    "httpx>=0.27",
    "structlog>=24.4",
    "pyyaml>=6.0",
    "platformdirs>=4.3",
    "python-multipart>=0.0.32",
    "pypdf>=6.0",
]

[project.scripts]
auto-apply = "auto_apply.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
    "pytest-timeout>=2.4.0",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auto_apply"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle / pyflakes
    "I",                # isort
    "UP",               # pyupgrade
    "B",                # bugbear
    "SIM",              # simplify
    "ASYNC",            # async pitfalls
    "RUF",
    "TID252",           # relative import 규칙
    "ANN",              # 타입 애노테이션 강제
]
ignore = ["ANN401"]     # **kwargs: Any 허용

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "B"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src"
packages = ["auto_apply"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# 멈춘 테스트가 게이트를 붙잡지 않고 실패하게 한다
addopts = "-q --strict-markers --timeout=120"
# 마커는 "무엇이 있어야 도는가"로만 가른다. 마커가 없는 테스트는 전부 기본 실행(make check)이다.
markers = [
    "native: 이 머신에 설치된 외부 바이너리가 있어야 도는 테스트 (Chrome/playwright 브라우저, claude CLI)",
]

# ---------------------------------------------------------------- import-linter
# 01-architecture.md §A2 의 계층 규칙을 강제한다 (make arch). 위반을 실제로 잡는지는
# tests/test_arch.py 가 일부러 위반을 심은 복사본으로 확인한다.
#   domain·contracts(순수, 서로 참조) < ports < services < runner < bootstrap < api < __main__
#   adapters 는 ports 를 구현하고 bootstrap 만 adapters 를 안다. ai 는 프롬프트/스키마만.
[tool.importlinter]
root_package = "auto_apply"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "domain 은 순수하다 (프레임워크/어댑터 무의존)"
type = "forbidden"
source_modules = ["auto_apply.domain"]
forbidden_modules = [
    "auto_apply.ports", "auto_apply.adapters", "auto_apply.services", "auto_apply.runner", "auto_apply.api", "auto_apply.bootstrap", "auto_apply.config",
    "auto_apply.__main__",
    "sqlalchemy", "alembic", "fastapi", "uvicorn", "anthropic", "playwright",
]

[[tool.importlinter.contracts]]
name = "contracts 는 벤더 의존 없음"
type = "forbidden"
source_modules = ["auto_apply.contracts"]
forbidden_modules = [
    "auto_apply.ports", "auto_apply.adapters", "auto_apply.services", "auto_apply.runner",
    "auto_apply.api", "auto_apply.bootstrap", "auto_apply.__main__",
    "sqlalchemy", "alembic", "fastapi", "uvicorn", "anthropic", "playwright",
]

[[tool.importlinter.contracts]]
name = "ports 는 구현을 모른다"
type = "forbidden"
source_modules = ["auto_apply.ports"]
forbidden_modules = [
    "auto_apply.adapters", "auto_apply.services", "auto_apply.runner", "auto_apply.api",
    "auto_apply.bootstrap", "auto_apply.__main__",
    "sqlalchemy", "alembic", "fastapi", "uvicorn", "anthropic", "playwright",
]

[[tool.importlinter.contracts]]
name = "ai 는 벤더 SDK 를 모른다 (프롬프트/스키마만)"
type = "forbidden"
source_modules = ["auto_apply.ai"]
forbidden_modules = [
    "auto_apply.adapters", "auto_apply.ports", "auto_apply.services", "auto_apply.runner",
    "auto_apply.api", "auto_apply.bootstrap", "auto_apply.__main__",
    "sqlalchemy", "alembic", "fastapi", "uvicorn", "anthropic", "playwright",
]

[[tool.importlinter.contracts]]
name = "services 는 port 만 안다 (§A2)"
type = "forbidden"
source_modules = ["auto_apply.services"]
forbidden_modules = [
    "auto_apply.adapters", "auto_apply.runner", "auto_apply.api", "auto_apply.bootstrap",
    "auto_apply.__main__",
    "sqlalchemy", "alembic", "fastapi", "uvicorn", "anthropic", "playwright",
]

[[tool.importlinter.contracts]]
name = "runner 는 services·port 만 안다 (§A2, §A9)"
type = "forbidden"
source_modules = ["auto_apply.runner"]
forbidden_modules = [
    "auto_apply.adapters", "auto_apply.api", "auto_apply.bootstrap", "auto_apply.__main__",
    "sqlalchemy", "alembic", "fastapi", "uvicorn", "anthropic", "playwright",
]

[[tool.importlinter.contracts]]
name = "adapters 는 상위 계층을 모른다"
type = "forbidden"
source_modules = ["auto_apply.adapters"]
forbidden_modules = [
    "auto_apply.services", "auto_apply.runner", "auto_apply.api", "auto_apply.bootstrap",
    "auto_apply.__main__",
]

[[tool.importlinter.contracts]]
name = "bootstrap 은 api·진입점을 모른다"
type = "forbidden"
source_modules = ["auto_apply.bootstrap"]
forbidden_modules = ["auto_apply.api", "auto_apply.__main__", "fastapi", "uvicorn"]

[[tool.importlinter.contracts]]
# "어댑터를 만드는 곳은 bootstrap 하나" (§A2). bootstrap 을 거쳐서 닿는 것은 정상이라 직접 import 만 막는다.
name = "어댑터 생성은 bootstrap 에서만"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["auto_apply.api", "auto_apply.__main__"]
forbidden_modules = ["auto_apply.adapters"]
