# v2 형식 예시 — 원래 `config/facts.example.yaml`. v3 에서는 v2 임포터(services/v2_import.py) 입력
# 양식으로만 쓴다(T1.3 테스트 픽스처). 아래 주석은 v2 당시 설명이다.
#
# config/facts.yaml — 이력서 생성의 유일한 사실 원천 (§A7).
#
# 여기 없는 경력·수치·프로젝트는 LLM 이 지어낼 수 없다 — review 게이트가 모든 서술에 fact_id
# 근거를 요구하고, 근거 없거나 존재하지 않는 fact_id 를 인용하면 실패시킨다(domain/resume_matching.py
# 의 ground_check). matching.yaml 과 같은 이유로 코드가 아니라 데이터다 — 이력이 바뀌면 코드를
# 고치지 않고 이 파일만 고친다.
#
# 아래는 형식 예시(placeholder)다. 실제 값으로 교체할 것.
#   - id: 이 파일 안에서만 유일하면 된다.
#   - user_id: StartApplication.user_id 와 같은 값이어야 매칭된다.
#   - kind: 자유 텍스트 태그. "experience" | "project" | "skill" | "education" 등 편한 대로.
#   - content: 이력서 문장에 그대로 인용될 수 있는 원문 서술.
#   - keywords: job 설명과 겹침을 판정하는 명시적 신호(matching.yaml 의 TrackRule.keywords 와 동일 철학).
#   - source: 이 사실의 근거(예: "2024 이력서", "포트폴리오 v3"). 검증 추적용.
#   - entity/block 계열: 이력서 경력·프로젝트 블록을 조립하는 그룹핑 키(kind=experience|project
#     에서만 쓴다). 경력은 회사 헤더 fact(block 없음) + 하위 블록 fact 여러 개, 개인 프로젝트는
#     헤더 fact 없이 block="main" 하나로 묶는다. 나머지 kind 는 전부 생략한다.
#   - entity_url: 엔티티 링크(개인 프로젝트면 GitHub 저장소 URL). content 에 원문으로 적지
#     않는다 — LLM 이 서술 안에 그대로 옮겨 적을지 여부에 기대지 않고, PdfRenderer 가 블록
#     제목 옆에 항상 링크로 그린다. 그룹 안 fact 중 하나에만 있으면 된다(보통 summary fact).

