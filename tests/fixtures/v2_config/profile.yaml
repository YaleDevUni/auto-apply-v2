# v2 형식 예시 — 원래 `config/profile.example.yaml`. v3 에서는 v2 임포터(services/v2_import.py) 입력
# 양식으로만 쓴다(T1.3 테스트 픽스처). 아래 주석은 v2 당시 설명이다.
#
# config/profile.yaml — 이력서 헤더/학력/스킬태그/언어의 유일한 원천 (§A7).
#
# facts.yaml과 달리 여기 값은 LLM 을 거치지 않고 이력서 템플릿에 그대로 꽂힌다 — 서술이
# 필요 없는 정형 정보(이름, 연락처, 학교명, GPA, 스킬 태그, 언어 등급)라서다.
#
# 아래는 형식 예시(placeholder)다. 실제 값으로 교체할 것.
#   - user_id: StartApplication.user_id 와 같은 값이어야 매칭된다.
#   - education/languages: 이력서에 노출하고 싶은 순서 그대로 나열한다.

- user_id: default
  name: "홍길동"
  phone: "+821000000000"
  email: "example@example.com"
  education:
    - school: "예시대학교"
      period: "2020.01 - 2024.02"
      status: "졸업"
      degree: "컴퓨터공학 학사, GPA 4.0/4.5"
      note: "120학점 이수"
  skills: [React, Node.js, Python, Docker, AWS]
  languages:
    - name: "영어"
      level: "비즈니스 레벨"
