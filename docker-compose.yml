# 개발 원칙: 인프라만 컨테이너로 띄우고, api/worker 는 호스트에서 uv 로 실행한다.
#   (Playwright 디버깅·핫리로드·브레이크포인트가 훨씬 쉽다. 배포용 이미지는 M4에서.)
name: auto-apply

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: auto_apply
      POSTGRES_PASSWORD: auto_apply
      POSTGRES_DB: auto_apply
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auto_apply"]
      interval: 5s
      timeout: 3s
      retries: 20

  temporal:
    image: temporalio/auto-setup:1.25.2
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: auto_apply
      POSTGRES_PWD: auto_apply
      POSTGRES_SEEDS: postgres
    ports: ["7233:7233"]
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
      interval: 10s
      timeout: 5s
      retries: 20

  # 운영 콘솔. ARCHITECTURE.md §9.4 — 1차 디버깅 도구는 여기다.
  temporal-ui:
    image: temporalio/ui:2.31.2
    depends_on: [temporal]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports: ["8080:8080"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  miniodata:
