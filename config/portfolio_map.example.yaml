# config/portfolio_map.yaml — "직무 카테고리별로 어느 첨부파일을 쓰는가"의 유일한 원천.
#
# 이력서 생성 LLM이 공고를 보고 categories 의 키(카테고리 라벨) 중 하나를 고르면(job_category),
# 코드가 그 라벨을 아래 파일명으로 바꿔 지원 Recipe 의 포트폴리오 selector 에 꽂는다
# (adapters/resume/_assemble.py, domain/recipe_selector.py). 파일명은 실제로 플랫폼(예: wanted)
# 화면에 보이는 이름과 정확히 같아야 한다 — 다르면 selector 가 못 찾는다.
#
# 아래는 형식 예시(placeholder)다. 실제 값으로 교체할 것. 매칭되는 카테고리가 없으면 코드가
# 그냥 포트폴리오를 안 붙인다 — 여기 없는 카테고리를 LLM 이 골라도 안전하다.

- user_id: default
  categories:
    개발자: "포트폴리오_풀스택.pdf"
    AX개발자: "포트폴리오_AX개발자.pdf"
    데브옵스: "포트폴리오_데브옵스.pdf"
