# 매칭 규칙 — 하드컷 / 트랙 / 스코어링.
#
# MatchingConfigSource(ports/matching_config.py) 가 읽어 domain/job_screening.py 와
# domain/job_applicability.py 에 그대로 넘긴다. 이 파일이 "지원 대상 직무가
# 무엇인가"를 정의하는 유일한 자리다 — 코드에는 트랙 이름도 키워드도 없다.
#
# 값은 이전 auto-apply 프로젝트(config.yaml)에서 수천 건으로 튠된 것을 그대로
# 옮겼다. 사용자가 자신의 구직 취향에 맞춰 계속 고쳐나가는 파일이다.

