# 지역 — 하드컷이 아니라 가산점
location:
  preferred: [서울, 경기, 인천, 성남, 판교, 수원, 안양, 부천, 고양, 용인]
  preferred_bonus: 10

applicability:
  # 이 점수 미만이면 자동지원하지 않는다. 무인 운영의 마지막 안전장치라 보수적으로 잡는다.
  min_fit_score: 75
  # 공고 본문이 이보다 짧으면 '요건 확인 불가'로 막는다 (NO_DETAIL).
  min_description_chars: 200
  # 공고의 필수요건인데 이력서 사실 저장소에 근거가 없는 항목이 이보다 많으면 막는다.
  max_required_gaps: 2
  # 마감까지 남은 일수가 이보다 적으면 자동지원하지 않는다.
  min_days_left: 1
  essays:
    autowrite: false
    max_autowrite: 3
  # 보유 중인 서류. 공고가 요구하는데 여기 없으면 DOC_MISSING으로 막힌다.
  available_documents: []
